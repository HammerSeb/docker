services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.1.2 # 
    container_name: mealie
    restart: always
    deploy:
      resources:
        limits:
          memory: 1000M # 
    volumes:
      - mealie-data:/app/data/
    environment:
      # Set Backend ENV Variables Here
      ALLOW_SIGNUP: "false"
      PUID: 9999
      PGID: 9999
      TZ: Europe/Berlin
      BASE_URL: https://mealie.hammersebastian.de

    networks:
      - npm
volumes:
  mealie-data:

networks:
  npm:
    external: true
    name: npm